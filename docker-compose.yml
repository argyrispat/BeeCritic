services:
  db:
    image: postgres:16-alpine
    container_name: beecritic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beecritic
      POSTGRES_PASSWORD: beecritic
      POSTGRES_DB: beecritic
    ports:
      - "5432:5432"
    volumes:
      - beecritic_pgdata:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    container_name: beecritic-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:5080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  beecritic_pgdata:
